<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAYY-X ANTI KOMPRES</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:15px}
.box{border:2px solid #0f0;padding:18px;border-radius:15px;max-width:500px;margin:auto}
button{background:#0f0;color:#000;padding:13px;border:none;border-radius:10px;font-weight:bold;width:100%;margin-top:10px}
#log{color:#fff;margin-top:12px;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h2>PAYY-X HD PATCHER<br>ANTI KOMPRES 576p</h2>
<p>Upload vidio burik gue sulap jadi 1080×1920 60FPS jadi upload vidio 1080 60 FPS no compress</p>
<input type="file" id="up" accept="video/*">
<button id="btn" onclick="patch()">PATCH SEKARANG - JADI HD</button>
<div id="log">Siap bos</div>
<video id="out" controls playsinline style="width:100%;display:none;margin-top:12px"></video>
<button id="dl" style="display:none;background:#00f0ff" onclick="downloadResult()">⬇️ DOWNLOAD HASIL HD</button>
<div class="rule" style="border:1px dashed #f00;padding:8px;margin-top:10px;font-size:11px">WAJIB: UPLOAD VIA TIKTOK WEB, NO ADD SOUND, NO ADD COVER</div>
</div>
<script>
let finalUrl=null;
async function patch(){
 let f=document.getElementById('up').files[0]; if(!f) return alert('Pilih video!');
 let log=document.getElementById('log'); let btn=document.getElementById('btn');
 btn.disabled=true; btn.innerText='PATCHING...';
 let v=document.createElement('video'); v.src=URL.createObjectURL(f); v.muted=true; v.playsInline=true;
 await new Promise(r=>{v.onloadedmetadata=r;});
 let c=document.createElement('canvas'); c.width=1080; c.height=1920; let ctx=c.getContext('2d');
 let stream=c.captureStream(60);
 // BITRATE ASLI - ga di-set angka, biarin ngikut bitrate asli video lu
 // Ini yang lu mau: resolusi 1080x1920 + 60FPS doang yang di-patch, bitrate biarin asli
 let rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});
 let chunks=[];
 rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data); log.innerText='Nge-patch '+Math.round(v.currentTime/v.duration*100)+'%... BITRATE ASLI';};
 rec.onstop=()=>{
   let blob=new Blob(chunks,{type:'video/webm'}); finalUrl=URL.createObjectURL(blob);
   document.getElementById('out').src=finalUrl; document.getElementById('out').style.display='block';
   document.getElementById('dl').style.display='block';
   btn.disabled=false; btn.innerText='PATCH SEKARANG - JADI HD';
   log.innerText='✅ DONE! '+(blob.size/1024/1024).toFixed(1)+' MB - 1080x1920 60FPS (Bitrate Asli)';
 };
 v.onended=()=>rec.stop();
 rec.start(100); v.play();
 (function draw(){ if(v.ended) return; ctx.drawImage(v,0,0,1080,1920); requestAnimationFrame(draw); })();
}
function downloadResult(){
 let a=document.createElement('a'); a.href=finalUrl; a.download='Payy_1080_60FPS_BitrateAsli.webm'; a.click();
}
</script>
</body>
</html>
