<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYY-HD REAL</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh">
<div style="border:2px solid #0f0;padding:20px;border-radius:12px;width:90%;max-width:400px;text-align:center">
<h3>PAYY-HD V6 REAL NO-FAKE</h3>
<p style="font-size:10px">Ini cuma jaga file asli biar ga drop sebelum upload</p>
<label for="f" style="display:block;border:2px dashed #0f0;padding:20px;margin:15px 0;cursor:pointer">TAP PILIH VIDEO</label>
<input type="file" id="f" accept="video/*" style="display:none">
<div id="info" style="font-size:11px;text-align:left"></div>
<a id="dl" style="display:none;background:#0f0;color:#000;padding:12px;border-radius:8px;margin-top:10px;text-decoration:none;font-weight:bold" download>DOWNLOAD FILE ASLI</a>
</div>
<script>
let file=null;
document.getElementById('f').onchange=e=>{
  file=e.target.files[0];
  document.getElementById('info').innerHTML = `Nama: ${file.name}<br>Size: ${(file.size/1024/1024).toFixed(2)} MB<br>Ini 100% bitrate/reso/fps asli lu`;
  const url=URL.createObjectURL(file);
  const a=document.getElementById('dl');
  a.href=url;
  a.download=`PAYY_REAL_${Date.now()}.mp4`;
  a.style.display='block';
  document.getElementById('info').innerHTML += `<br><br>DONE - File ini SAMA PERSIS sama file CapCut lu, ga ada kompresi. Upload ini via tiktok.com desktop`;
}
</script>
</body>
</html>
