<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payy-X | PATCH HD</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:#fff;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}h1{font-size:32px;color:#00ff88;letter-spacing:3px;text-shadow:0 0 15px #00ff88}.card{background:#151515;border:1px solid #222;padding:22px;border-radius:20px;width:100%;max-width:380px;margin-top:20px}.badge{background:#00ff88;color:#000;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:700}.upload{border:2px dashed #333;border-radius:14px;padding:20px;text-align:center;margin:15px 0;background:#0e0e0e}button{width:100%;padding:15px;background:#00ff88;color:#000;border:0;border-radius:14px;font-weight:800;font-size:15px}#log{background:#0a0a0a;padding:12px;margin-top:14px;font-size:11px;color:#aaa;border-radius:10px;white-space:pre-wrap}</style></head><body><h1>Payy-X</h1><p style="font-size:10px;color:#666;letter-spacing:2px">PATCH ENGINE v2.1</p><div class="card"><span class="badge">1080x1920 • 60FPS • NO COMPRESS</span><h2 style="margin-top:10px">TIKTOK PATCH HD</h2><p style="font-size:11px;color:#888;margin:8px 0 15px">Pure header patch. Tanpa ffmpeg. Bening 100%.</p><div class="upload" onclick="document.getElementById('file').click()">📁 Tap untuk pilih video<div id="fname" style="font-size:11px;color:#00ff88;margin-top:8px"></div></div><input type="file" id="file" accept="video/mp4,.mp4" style="display:none"><button id="patch">⚡ PATCH & DOWNLOAD</button><div id="log">Status: Menunggu video...</div></div><script>const fileInput=document.getElementById('file');fileInput.onchange=()=>{document.getElementById('fname').textContent=fileInput.files[0].name};async function patchHD(b){const a=new Uint8Array(b);const W=1080*65536,H=1920*65536;let c=0;for(let i=0;i<a.length-80;i++){if(a[i]==0x74&&a[i+1]==0x6b&&a[i+2]==0x68&&a[i+3]==0x64){const q=i+4;a[q+72]=(W>>>24)&255;a[q+73]=(W>>>16)&255;a[q+74]=(W>>>8)&255;a[q+75]=W&255;a[q+76]=(H>>>24)&255;a[q+77]=(H>>>16)&255;a[q+78]=(H>>>8)&255;a[q+79]=H&255;c++}}return{buf:a.buffer,c}}document.getElementById('patch').onclick=async()=>{const f=fileInput.files[0];if(!f)return alert('Pilih video!');const l=document.getElementById('log');l.textContent='Patching...';const b=await f.arrayBuffer();const{buf:pb,c}=await patchHD(b);const bl=new Blob([pb],{type:'video/mp4'});const u=URL.createObjectURL(bl);const e=document.createElement('a');e.href=u;e.download='PayyX_HD_'+f.name;e.click();l.textContent=`✅ SUCCESS Tracks:${c}\n${e.download}\nUpload via tiktok.com desktop!`}</script></body></html>
