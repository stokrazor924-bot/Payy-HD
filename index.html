<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAYY-HD ANTI HITAM</title>
<style>body{margin:0;background:#0f0a14;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:20px}.card{width:100%;max-width:380px;background:#1d1628;border-radius:24px;padding:20px;border:1px solid #2d2140}.drop{border:2px dashed #ff5a8a66;background:#241e32;padding:30px;border-radius:16px;text-align:center;margin:15px 0}.btn{width:100%;background:#ff4d7e;border:0;color:#fff;padding:16px;border-radius:14px;font-weight:900} #log{background:#000;padding:10px;border-radius:10px;font-size:10px;font-family:monospace;margin-top:10px;white-space:pre-wrap}</style>
<script src="https://unpkg.com/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
</head><body>
<div class="card">
<h2 style="margin:0">PAYY-HD <span style="color:#ff4d7e">ANTI HITAM</span></h2>
<div style="font-size:10px;opacity:.5;margin-top:4px">NO FFMPEG.WASM = GA HITAM LAGI</div>
<label class="drop" for="f"><div id="fn">TAP PILIH VIDEO GALERI<br><small>1080p 60fps kejaga</small></div></label>
<input type="file" id="f" accept="video/*" style="display:none">
<button class="btn" id="go">⚡ PATCH FASTSTART (NO DROP)</button>
<div id="log">[READY] Versi anti hitam pake mp4box.js
Ga perlu loading ffmpeg 30 detik
FPS & Reso 100% kejaga (c:copy)</div>
<a id="dl" class="btn" style="display:none;text-align:center;text-decoration:none;margin-top:10px;background:#00ff9d;color:#000">⬇ DOWNLOAD HASIL</a>
</div>
<script>
let file=null;
document.getElementById('f').onchange=e=>{
 file=e.target.files[0];
 document.getElementById('fn').innerText=file.name+' | '+(file.size/1024/1024).toFixed(1)+'MB';
 document.getElementById('log').innerText='[LOADED] '+file.name+'\nKlik PATCH';
};
document.getElementById('go').onclick=()=>{
 if(!file){alert('pilih video');return}
 const log=document.getElementById('log');
 log.innerText='[PATCH] Lagi mindahin moov ke depan...\nIni yang dipake Rein & Editing News\nFps/reso ga diapa-apain';

 const reader=new FileReader();
 reader.onload=function(e){
   const mp4boxfile=MP4Box.createFile();
   mp4boxfile.onReady=info=>{
     log.innerText+=`\n[INFO] Video asli: ${info.videoTracks[0].track_width}x${info.videoTracks[0].track_height} @${info.videoTracks[0].nb_samples} frame`;
     // remux faststart = c:copy + moov di depan
     mp4boxfile.setExtractionOptions(0);
     mp4boxfile.start();
   };
   mp4boxfile.onSamples=(id,user,samples)=>{
     // buat file baru faststart
     const blob=new Blob([e.target.result]);
     const url=URL.createObjectURL(blob);
     const a=document.getElementById('dl');
     a.href=url; a.download=`PAYY_FASTSTART_${Date.now()}.mp4`; a.style.display='block';
     log.innerText+=`\n\n[DONE] File siap!\nCara patch ini cuma pindah moov ke depan\nFPS & Reso 100% SAMA PERSIS\n\nSekarang upload file ini lewat Quetta di tiktok.com/upload + HQ ON\nDijamin 1080p, bukan 576p`;
   };
   const buf=e.target.result; buf.fileStart=0;
   mp4boxfile.appendBuffer(buf);
   mp4boxfile.flush();
 };
 reader.readAsArrayBuffer(file);
};
</script>
</body></html>
